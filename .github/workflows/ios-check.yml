name: iOS compile check
# Compiles the iPhone app for the simulator (no signing, nothing uploaded). Started by hand only.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator
        working-directory: ios/Rihal
        run: |
          set -o pipefail
          xcodebuild -project QiblaCompass.xcodeproj -scheme QiblaCompass \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        working-directory: ios/Rihal
        run: grep -E "error:" build.log | sort -u | head -80
